name: Enzo Biochem
description: >-
  Enzo Biochem, Inc. (operating as Enzo Life Sciences) is a life sciences company
  specializing in labeling and detection technologies for biomedical research and
  drug development. Trading under the tagline "Scientists Enabling Scientists," Enzo
  develops and manufactures research reagents and assays including AMPIVIEW RNA probes
  for in-situ hybridization and FISH, antibodies, ELISA immunoassays, immunohistochemistry
  (IHC) products, and CELLESTIAL cell-based assays. Its biopharma arm provides drug
  discovery services, target identification and validation, assay development, in vitro
  toxicology, and GMP manufacturing. Products are sold through an online catalog and
  account portal at enzo.com rather than a public developer API. This profile was added
  to the API Evangelist network as a stub company lead and enriched with the identity,
  website, and domain-security posture that could be verified from public sources.
